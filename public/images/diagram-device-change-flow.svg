<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Device change flow for a damaged machine</title>
<desc>Five step flow showing how a customer moves a license to a new device when the old device is damaged or unreachable, using email verification instead of an in app button.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="190" y="30" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="46" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">Old device is lost or damaged</text>
<text x="340" y="64" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="sans-serif">In-app deactivation is not possible</text>
<line x1="340" y1="86" x2="340" y2="114" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="116" width="300" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="340" y="132" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C" font-family="sans-serif">Customer submits a request</text>
<text x="340" y="150" text-anchor="middle" font-size="12" fill="#993C1D" font-family="sans-serif">Provides license key and purchase email</text>
<line x1="340" y1="172" x2="340" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="202" width="300" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C" font-family="sans-serif">System verifies the email</text>
<text x="340" y="236" text-anchor="middle" font-size="12" fill="#993C1D" font-family="sans-serif">Must match the email on record</text>
<line x1="340" y1="258" x2="340" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="288" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="304" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C" font-family="sans-serif">Old device released</text>
<text x="340" y="322" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">License is freed for reactivation</text>
<line x1="340" y1="344" x2="340" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="374" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="390" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C" font-family="sans-serif">Customer activates new device</text>
<text x="340" y="408" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">Same license key, normal activation steps</text>
</svg>
